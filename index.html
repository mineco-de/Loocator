<!DOCTYPE html>
<html lang="de" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loocator - WC & Eurokey Finder</title>
    <meta name="description" content="Finde schnell öffentliche Toiletten, rollstuhlgerechte Eurokey-WCs und Wickeltische in deiner Nähe. Kostenlos und ohne Registrierung.">
    
    <meta property="og:title" content="Loocator - Öffentliche WCs & Eurokey">

    <meta property="og:url" content="https://loocator.org">
    
    <!-- SEO Canonical -->

    <link rel="icon" type="image/svg+xml" href="/img/loocator.svg?v=1">

    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">

    <!-- Frühe Verbindungen zu externen Diensten (spart DNS/TLS-Handshake-Zeit) -->

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <!-- Tailwind: lokal vorkompiliert via `npm run build:css` (siehe tailwind.config.js) -->

    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- Nicht render-kritische Scripts: laden parallel, ausgeführt erst nach dem Parsen -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous" defer></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js" integrity="sha384-RLIyj5q1b5XJTn0tqUhucRZe40nFTocRP91R/NkRJHwAe4XxnTV77FXy/vGLiec2" crossorigin="anonymous" defer></script>
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js" integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin="anonymous" defer></script>
    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js" integrity="sha384-tXYNKOHx4T02jMP7YYCtBxPIv1B5gaA5mcVPBzqMp6d7VzWzxJgI2aWF/nJLrQdS" crossorigin="anonymous" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" integrity="sha384-HAH79XdRvHr6axVGh4xQWVCp14kcd32bNk4Xu0sHDHtFQ42n6BAM8ykvB47dGz6D" crossorigin="anonymous" defer></script>

</head>
<body class="bg-gray-100 dark:bg-gray-900 overflow-hidden font-sans text-gray-800 dark:text-gray-100">

    <div id="splash-screen" class="fixed inset-0 bg-brand-600 z-[9999] flex flex-col items-center justify-center transition-opacity duration-500">
        <img src="img/loocator.svg" alt="" width="48" height="48" class="mb-7 rounded-xl drop-shadow-lg">
        <svg class="w-14 h-14 mb-4 text-white drop-shadow-lg animate-bounce" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 2h9a1 1 0 0 1 1 1v3H6V3a1 1 0 0 1 1-1z"/>
            <path d="M5 8h15a1 1 0 0 1 1 1v.5a2 2 0 0 1-1.3 1.87V13a6.7 6.7 0 0 1-6.7 6.7h-.5A6.7 6.7 0 0 1 5.3 13v-1.63A2 2 0 0 1 4 9.5V9a1 1 0 0 1 1-1z"/>
        </svg>
        <h1 class="text-white text-3xl font-display font-bold tracking-tight mb-2">Loocator</h1>
        <p class="text-brand-100 text-sm font-medium flex items-center gap-2">
            <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
            <span data-i18n="splashLoading"></span>
        </p>
    </div>

    <div id="offline-banner" data-i18n="offline" class="hidden absolute top-0 w-full bg-red-600 text-white text-center p-2 text-sm font-bold ui-layer shadow-md transition-opacity"></div>

    

    <!-- ============================================ -->
    <!-- GOOGLE-MAPS-STYLE TOP BAR: Immer sichtbar (Suche + Menü-Button + Filter-Pillen) -->
    <!-- ============================================ -->
    <div id="top-bar" class="absolute top-4 left-4 right-4 md:right-auto md:w-[25rem] z-[900] flex flex-col gap-3 ui-layer">
        <!-- Moderne Suche mit integriertem Menü-Button (Google-Maps-Stil) -->
        <div class="relative flex flex-col">
            <div class="flex items-center gap-2">
                <button id="btn-open-menu" class="shrink-0 bg-cream dark:bg-deep-800 text-gray-600 dark:text-gray-300 p-3.5 rounded-full shadow-md active:scale-95 transition-all duration-200 flex items-center justify-center border border-cream-200 dark:border-deep-600">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                    </svg>
                </button>
                <form id="search-form" class="relative flex-1">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <img src="img/search.svg" alt="Search" class="w-4 h-4 opacity-40 dark:invert">
                    </div>
                    <input type="text" id="search-input" data-i18n-placeholder="searchPlaceholder" class="w-full bg-cream dark:bg-deep-800 dark:text-white border border-cream-200 dark:border-deep-600 focus:border-brand-400 focus:ring-2 focus:ring-brand-100 dark:focus:ring-brand-700/40 rounded-full py-3.5 pl-11 pr-4 text-base sm:text-sm font-medium transition-all outline-none shadow-md" autocomplete="off">
                </form>
            </div>
            <ul id="search-suggestions" class="hidden absolute top-full left-[3.25rem] w-[calc(100%-3.25rem)] bg-white dark:bg-deep-700 border border-cream-200 dark:border-deep-600 shadow-xl rounded-2xl mt-2 max-h-48 overflow-y-auto z-50 text-sm"></ul>
        </div>

        <!-- Hauptfilter: Favoriten, Öffentlich, Eurokey+Rollstuhl, Wickeltisch, Kostenlos -->
        <div class="flex gap-2 pt-1 pb-1 overflow-x-auto snap-x snap-mandatory hide-scrollbar fade-scroll-x -mx-5 px-9 md:flex-wrap md:overflow-visible md:mx-0 md:px-0">
            <label class="cursor-pointer snap-start shrink-0">
                <input type="checkbox" id="filter-favorites" class="peer sr-only">
                <div class="px-4 py-2.5 rounded-full border border-accent-100 dark:border-accent-600/40 bg-cream dark:bg-deep-800 text-accent-500 dark:text-accent-400 text-xs font-bold transition-all peer-checked:bg-accent-600 peer-checked:text-white peer-checked:border-accent-600 shadow-md flex items-center gap-1.5 whitespace-nowrap ml-3">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 20s-8-5.5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 9c0 5.5-8 11-8 11z"/></svg>
                    <span data-i18n="filterFav"></span>
                </div>
            </label>

            <label class="cursor-pointer snap-start shrink-0">
                <input type="checkbox" id="filter-public" class="peer sr-only" checked>
                <div class="px-4 py-2.5 rounded-full border border-cream-200 dark:border-deep-600 bg-cream dark:bg-deep-800 text-gray-600 dark:text-gray-300 text-xs font-bold transition-all peer-checked:bg-brand-700 peer-checked:text-white peer-checked:border-brand-700 shadow-md whitespace-nowrap flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h9a1 1 0 0 1 1 1v3H6V3a1 1 0 0 1 1-1z"/><path d="M5 8h15a1 1 0 0 1 1 1v.5a2 2 0 0 1-1.3 1.87V13a6.7 6.7 0 0 1-6.7 6.7h-.5A6.7 6.7 0 0 1 5.3 13v-1.63A2 2 0 0 1 4 9.5V9a1 1 0 0 1 1-1z"/></svg>
                    <span data-i18n="filterPublic"></span>
                </div>
            </label>

            <label class="cursor-pointer snap-start shrink-0">
                <input type="checkbox" id="filter-eurokey" class="peer sr-only" checked>
                <div class="px-4 py-2.5 rounded-full border border-cream-200 dark:border-deep-600 bg-cream dark:bg-deep-800 text-gray-600 dark:text-gray-300 text-xs font-bold transition-all peer-checked:bg-eurokey peer-checked:text-gray-900 peer-checked:border-eurokey shadow-md whitespace-nowrap flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z"/></svg>
                    <span data-i18n="filterEurokey"></span>
                </div>
            </label>

            <label class="cursor-pointer snap-start shrink-0">
                <input type="checkbox" id="filter-changing" class="peer sr-only">
                <div class="px-4 py-2.5 rounded-full border border-cream-200 dark:border-deep-600 bg-cream dark:bg-deep-800 text-gray-600 dark:text-gray-300 text-xs font-bold transition-all peer-checked:bg-purple-600 peer-checked:text-white peer-checked:border-purple-600 shadow-md whitespace-nowrap flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M6.5 20v-2.5a5.5 5.5 0 0111 0V20"/></svg>
                    <span data-i18n="filterChanging"></span>
                </div>
            </label>

            <label class="cursor-pointer snap-start shrink-0">
                <input type="checkbox" id="filter-free" class="peer sr-only">
                <div class="px-4 py-2.5 rounded-full border border-cream-200 dark:border-deep-600 bg-cream dark:bg-deep-800 text-gray-600 dark:text-gray-300 text-xs font-bold transition-all peer-checked:bg-green-700 peer-checked:text-white peer-checked:border-green-700 shadow-md whitespace-nowrap flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="8" y1="8" x2="16" y2="16"/></svg>
                    <span data-i18n="filterFree"></span>
                </div>
            </label>

            <!-- Reduziert die Zahl der auf einen Blick sichtbaren Entscheidungen (siehe Design-Kritik: kognitive
                 Überladung durch bis zu 8 gleichzeitig sichtbare Filter-Pillen) -->
            <button id="btn-toggle-more-filters" type="button" aria-expanded="false" class="shrink-0 snap-start px-3 py-2.5 rounded-full border border-cream-200 dark:border-deep-600 bg-cream dark:bg-deep-800 text-gray-500 dark:text-gray-400 shadow-md flex items-center justify-center transition-transform">
                <svg class="w-4 h-4 transition-transform" id="icon-more-filters" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" /></svg>
            </button>
        </div>

        <!-- Unterfilter: Jetzt offen, Hohe Erfolgsrate, Unzuverlässige ausblenden - eingeklappt per Default -->
        <div id="secondary-filters" class="hidden flex-col gap-2">
        <div class="flex gap-2 pt-1 pb-1 overflow-x-auto snap-x snap-mandatory hide-scrollbar fade-scroll-x -mx-5 px-9 md:flex-wrap md:overflow-visible md:mx-0 md:px-0">
            <label class="cursor-pointer snap-start shrink-0">
                <input type="checkbox" id="filter-open" class="peer sr-only">
                <div class="px-4 py-2.5 rounded-full border border-cream-200 dark:border-deep-600 bg-cream dark:bg-deep-800 text-gray-600 dark:text-gray-300 text-xs font-bold transition-all peer-checked:bg-green-700 peer-checked:text-white peer-checked:border-green-700 shadow-md whitespace-nowrap flex items-center gap-1.5 ml-3">
                    <span class="inline-flex items-center gap-2"><span class="inline-block w-2.5 h-2.5 rounded-full shrink-0 bg-green-500 ring-1 ring-black/10" aria-hidden="true"></span><span data-i18n="filterOpen"></span></span>
                </div>
            </label>

            <label class="cursor-pointer snap-start shrink-0">
                <input type="checkbox" id="filter-success" class="peer sr-only">
                <div class="px-4 py-2.5 rounded-full border border-cream-200 dark:border-deep-600 bg-cream dark:bg-deep-800 text-gray-600 dark:text-gray-300 text-xs font-bold transition-all peer-checked:bg-success peer-checked:text-white peer-checked:border-success shadow-md whitespace-nowrap flex items-center gap-1.5">
                    <span class="inline-flex items-center gap-2"><span class="inline-block w-2.5 h-2.5 rounded-full shrink-0 bg-yellow-400 ring-1 ring-black/10" aria-hidden="true"></span><span data-i18n="filterSuccess"></span></span>
                </div>
            </label>

            <label class="cursor-pointer snap-start shrink-0">
                <input type="checkbox" id="filter-nobad" class="peer sr-only">
                <div class="px-4 py-2.5 rounded-full border border-cream-200 dark:border-deep-600 bg-cream dark:bg-deep-800 text-gray-600 dark:text-gray-300 text-xs font-bold transition-all peer-checked:bg-red-600 peer-checked:text-white peer-checked:border-red-600 shadow-md whitespace-nowrap flex items-center gap-1.5">
                    <span class="inline-flex items-center gap-2"><span class="inline-block w-2.5 h-2.5 rounded-full shrink-0 bg-red-500 ring-1 ring-black/10" aria-hidden="true"></span><span data-i18n="filterNoBad"></span></span>
                </div>
            </label>
        </div>
        </div>
    </div>

<!-- Abdunkelung hinter der Sidebar, schließt beim Antippen -->
<div id="sidebar-backdrop" class="hidden opacity-0 fixed inset-0 bg-gray-900/50 z-[940] transition-opacity duration-300"></div>

<div id="main-menu" class="fixed inset-y-0 left-0 w-[85vw] max-w-xs bg-white dark:bg-gray-800 shadow-2xl z-[950] flex flex-col -translate-x-full transition-transform duration-300 ease-out overflow-y-auto">

    <div class="p-5 flex flex-col gap-5 flex-1">
        <!-- Header: Marke & Schließen-Button -->
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="img/loocator.svg" alt="" width="36" height="36" class="rounded-lg shrink-0">
                <div>
                    <h1 class="text-xl font-display font-bold text-brand-600 dark:text-brand-400 tracking-tight leading-tight">Loocator</h1>
                    <p class="text-[10px] text-gray-500 dark:text-gray-400 mt-1 font-bold uppercase tracking-widest leading-snug" data-i18n="appDesc"></p>
                </div>
            </div>

            <button id="btn-close-menu" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-2 active:scale-95 transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
        </div>

        <!-- Sprachwechsler -->
        <div>
            <span class="text-[10px] uppercase tracking-widest font-bold text-gray-400 dark:text-gray-500 mb-1.5 block">Sprache / Language</span>
            <div id="lang-switcher" class="grid grid-cols-4 gap-1.5">
                <button type="button" data-lang="de" class="lang-btn py-2 rounded-lg text-xs font-bold border border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300 transition-all">DE</button>
                <button type="button" data-lang="en" class="lang-btn py-2 rounded-lg text-xs font-bold border border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300 transition-all">EN</button>
                <button type="button" data-lang="fr" class="lang-btn py-2 rounded-lg text-xs font-bold border border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300 transition-all">FR</button>
                <button type="button" data-lang="es" class="lang-btn py-2 rounded-lg text-xs font-bold border border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300 transition-all">ES</button>
            </div>
        </div>

        <!-- Theme-Switcher -->
        <div class="flex items-center justify-between">
            <span class="text-[10px] uppercase tracking-widest font-bold text-gray-400 dark:text-gray-500">Theme</span>
            <div class="flex items-center bg-gray-100 dark:bg-gray-700 p-1 rounded-full shadow-inner border border-gray-200 dark:border-gray-600">
                <button id="btn-theme-light" class="p-1.5 rounded-full transition-all duration-300 flex items-center justify-center w-8 h-8" title="Hell">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z" /></svg>
                </button>
                <button id="btn-theme-dark" class="p-1.5 rounded-full transition-all duration-300 flex items-center justify-center w-8 h-8" title="Dunkel">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z" clip-rule="evenodd" /></svg>
                </button>
            </div>
        </div>

        <!-- PWA Install Area -->
        <button id="btn-install" data-i18n="btnInstall" class="hidden bg-brand-500 text-white px-4 py-3 rounded-xl text-sm font-bold active:bg-brand-700 transition-colors shadow-md flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
            <span data-i18n="btnInstall"></span>
        </button>

        <div id="ios-install-hint" class="hidden bg-brand-50 dark:bg-gray-700 p-3 rounded-xl text-xs border border-brand-100 dark:border-gray-600 text-brand-700 dark:text-brand-200">
            <span class="font-bold" data-i18n="iosHintTitle"></span><br>
            <span data-i18n="iosHintBody"></span>
        </div>

        <div class="flex-1"></div>

        <!-- Legende (aus der Karte hierher verschoben - stand dort als schwebender
             "?"-Button ständig im Weg und wurde versehentlich angetippt) -->
        <button id="btn-legend" class="w-full bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 px-4 py-2.5 rounded-xl text-sm font-bold text-center active:scale-95 transition-transform border border-gray-200 dark:border-gray-600 shadow-sm flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.5m0 3h.008v.008h-.008v-.008ZM21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
            <span data-i18n="btnLegend"></span>
        </button>
